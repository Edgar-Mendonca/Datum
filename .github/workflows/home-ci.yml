name: Datum Home CI
# Checks Datum Home (home/) on every push that touches it: types, UI build, clippy, tests, and a Windows build.
on:
  push:
    paths: ["home/**", ".github/workflows/home-*.yml"]
  pull_request:
    paths: ["home/**", ".github/workflows/home-*.yml"]

defaults:
  run:
    working-directory: home

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: home
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: home/package-lock.json
      - run: npm ci
      - run: npm run check:ui
      - run: npm run build:ui
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: home
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: home/package-lock.json
      - run: npm ci
      - run: npm run build:ui
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
