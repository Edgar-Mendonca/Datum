[package]
name = "datum-home"
version = "0.1.4"
edition = "2021"
description = "Datum Home: install, update, open and remove the Datum apps."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
datum-home-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
ureq = { version = "2", features = ["json", "native-certs"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
