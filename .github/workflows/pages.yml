# Builds the Datum family site (site/) and deploys it to GitHub Pages.
# Settings › Pages › Source must be "GitHub Actions".
name: Pages

on:
  push:
  schedule:
    - cron: "17 * * * *"        # hourly: picks up new app releases within the hour
  workflow_dispatch:
  repository_dispatch:
    types: [app-released]       # an app's release.yml can trigger a rebuild

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pushes deploy only from the default branch; the other triggers always run on it.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings › Pages › Source is still "Deploy from a branch", GitHub also runs its own branch build,
      # which publishes the raw repository (no index.html at the root: a 404). Wait for it, so this deploy lands last.
      # Setting the source to "GitHub Actions" removes that build; then this step returns at once.
      - name: Wait for the branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            [ "$n" = "0" ] && exit 0
            sleep 5
          done
      - id: deployment
        uses: actions/deploy-pages@v4
